name: Kernel CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Verify shared types 
  shared-check:
    name: Shared Types Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (safe read-only install)
        run: npm ci

      - name: Typecheck shared/types.ts
        working-directory: ./shared
        run: npx tsc --noEmit

  #   Verify Backend 
  backend-check:
    name: Backend & Prisma Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma Schema
        working-directory: ./apps/backend
        env:
          # Dummy URL only for syntax validation — CI does not connect to a real DB here
          DATABASE_URL: "postgresql://user:pass@localhost:5432/kernel_ci"
        run: npx prisma validate

      - name: Generate Prisma Client
        working-directory: ./apps/backend
        run: npx prisma generate

      - name: Typecheck Backend
        working-directory: ./apps/backend
        run: npx tsc --noEmit

  # Verify Dashboard  
  dashboard-check:
    name: Dashboard Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Dashboard
        working-directory: ./apps/dashboard
        run: npm run build